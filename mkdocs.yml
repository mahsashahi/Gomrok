site_name: Gomrok — database
docs_dir: .claude/docs
site_dir: .mkdocs-site

theme:
  name: material
  features:
    - navigation.expand
    - content.code.copy

nav:
  - Design (canonical): database-design.md
  - Diagram: database-diagram.md
  - Per-table guide: db_explain.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Build: pip install mkdocs-material && mkdocs build
# Serve: mkdocs serve
